name: Bug report
description: Report a bug in a script
title: "[BUG] "
labels: "bug"
type: bug
assignees:
  - claudinec
body:
  - type: dropdown
    attributes:
      label: Script name
      options:
        - afcLogTotals
        - copyPageContent
        - highlightPiped
        - SkinSwitcher
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Skin
      description: If reporting an issue with SkinSwitcher, this is your skin before switching
      options:
        - Vector 2022 (desktop default)
        - Vector 2010
        - Timeless
        - Minerva (mobile default)
        - MonoBook
      default: 0
  - type: input
    attributes:
      label: Browser
      description: Name of web browser or app
  - type: upload
    attributes:
      label: Screenshots
    validations:
      accept: ".png,.jpg,.jpeg,.heic"

